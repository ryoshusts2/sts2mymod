name: Build MyFirstMod

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '9.0.x'
        
    - name: Install ilspycmd
      run: dotnet tool install -g ilspycmd
      
    - name: Decompile sts2.dll
      run: ilspycmd -o decompiled sts2.dll
      
    - name: Upload Decompiled Source
      uses: actions/upload-artifact@v4
      with:
        name: DecompiledSts2Source
        path: decompiled/
        
    - name: Restore dependencies
      run: dotnet restore MyFirstMod.csproj
      
    - name: Build Mod
      run: dotnet build MyFirstMod.csproj -c Release -p:CopyModOnBuild=false -p:RunPckExport=false
      continue-on-error: true
      
    - name: Upload DLL
      uses: actions/upload-artifact@v4
      with:
        name: MyFirstModDLL
        path: bin/Release/net9.0/MyFirstMod.dll
