name: Build MyFirstMod
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v4
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '9.0.x'
    - name: Restore dependencies
      run: dotnet restore MyFirstMod.csproj
    - name: Build Mod
      run: dotnet build MyFirstMod.csproj -c Release
    - name: Upload DLL
      uses: actions/upload-artifact@v4
      with:
        name: MyFirstMod
        # 修改：使用绝对路径+通配符，强行把云端里所有叫这个名字的 DLL 都抓下来
        path: ${{ github.workspace }}/**/MyFirstMod.dll
