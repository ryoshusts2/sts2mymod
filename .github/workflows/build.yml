name: Build MyFirstMod
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v4
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '9.0.x'
    - name: Restore dependencies
      run: dotnet restore MyFirstMod.csproj
    - name: Build Mod
      # 关键：强制指定编译输出到当前目录的 publish 文件夹
      run: dotnet build MyFirstMod.csproj -c Release -o ./publish
    - name: Upload DLL
      uses: actions/upload-artifact@v4
      with:
        name: MyFirstMod
        # 直接去刚设定的 publish 文件夹里拿
        path: ./publish/MyFirstMod.dll
