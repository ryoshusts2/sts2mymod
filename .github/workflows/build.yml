name: Build MyFirstMod
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v4
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '9.0.x'
    - name: Restore dependencies
      run: dotnet restore MyFirstMod.csproj
    - name: Build Mod
      run: dotnet build MyFirstMod.csproj -c Release -o ./publish
    - name: Upload All Mod Files
      uses: actions/upload-artifact@v4
      with:
        name: MyFirstMod
        # 把游戏运行 Mod 必须用到的全部 DLL 和 json 一起打包
        path: |
          ./publish/MyFirstMod.dll
          ./publish/0Harmony.dll
          ./publish/sts2.dll
          ./publish/Steamworks.NET.dll
          ./MyFirstMod.json
