name: Build MyFirstMod
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v4
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '9.0.x'
    - name: Restore dependencies
      run: dotnet restore MyFirstMod.csproj
    - name: Build Mod
      run: dotnet build MyFirstMod.csproj -c Release
    - name: Locate DLL (Debug)
      run: dir /s /b MyFirstMod.dll
    - name: Upload DLL
      uses: actions/upload-artifact@v4
      with:
        name: MyFirstMod
        # 使用绝对路径强制抓取，确保万无一失
        path: ${{ github.workspace }}/bin/Release/net9.0/MyFirstMod.dll
